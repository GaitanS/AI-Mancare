name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'mysql://root:password@127.0.0.1:3306/test_db'
  NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
  OPENAI_API_KEY: 'sk-test'
  OPENROUTER_API_KEY: 'test-key'

jobs:
  # =====================
  # LINT & TYPE CHECK
  # =====================
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  # =====================
  # UNIT TESTS
  # =====================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test -- --coverage --forceExit
        continue-on-error: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # =====================
  # BUILD
  # =====================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10
    env:
      DATABASE_URL: 'mysql://root:password@127.0.0.1:3306/test_db'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Wait for MySQL to be ready
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -u root -ppassword -e "SELECT 1" &>/dev/null; then
              echo "MySQL is ready!"
              mysql -h 127.0.0.1 -u root -ppassword -e "SHOW DATABASES;"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 3
          done

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next
          retention-days: 7

  # =====================
  # DEPLOY TO PRODUCTION (disabled until secrets are configured)
  # =====================
  # To enable deployment, add these secrets in GitHub repository settings:
  # - SSH_HOST: Your server hostname (e.g., ssh.hostinger.com)
  # - SSH_USER: SSH username
  # - SSH_KEY: SSH private key
  # - DEPLOY_PATH: Deployment path on server
  # - DATABASE_URL: Production database URL
