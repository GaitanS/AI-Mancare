name: Scheduled Tasks - Scraping, Recipes & Images

on:
  # Scheduled runs (cron uses UTC timezone)
  schedule:
    # Scraping: Every Monday at 4:00 AM UTC (6:00 AM Romania time)
    - cron: '0 4 * * 1'
  
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - scrape
          - recipes
          - images

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  AI_MODEL: google/gemini-3-flash-preview
  AI_MODEL_VISION: google/gemini-3-flash-preview
  NODE_ENV: production
  NEXT_PUBLIC_SITE_URL: https://catalogsmart.ro

jobs:
  scraper:
    name: 🕷️ Catalog Scraper
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.task == 'all' || github.event.inputs.task == 'scrape'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Catalog Scraper
        run: node scripts/cron-scraper.js
        timeout-minutes: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: storage/logs/
          retention-days: 7

  recipes:
    name: 🍳 Recipe Generator
    runs-on: ubuntu-latest
    needs: scraper
    if: always() && (github.event_name == 'schedule' || github.event.inputs.task == 'all' || github.event.inputs.task == 'recipes')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Recipe Generator
        run: node scripts/cron-recipe-generator.js
        timeout-minutes: 60

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-logs-${{ github.run_number }}
          path: storage/logs/
          retention-days: 7

  images:
    name: 🖼️ Image Generator
    runs-on: ubuntu-latest
    needs: recipes
    if: always() && (github.event_name == 'schedule' || github.event.inputs.task == 'all' || github.event.inputs.task == 'images')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Image Generator
        run: node scripts/cron-image-generator.js 10
        timeout-minutes: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-logs-${{ github.run_number }}
          path: storage/logs/
          retention-days: 7

  notify:
    name: 📢 Completion Notification
    runs-on: ubuntu-latest
    needs: [scraper, recipes, images]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "Scraper: ${{ needs.scraper.result }}"
          echo "Recipes: ${{ needs.recipes.result }}"
          echo "Images: ${{ needs.images.result }}"
          
          if [ "${{ needs.scraper.result }}" == "success" ] && [ "${{ needs.recipes.result }}" == "success" ]; then
            echo "✅ All tasks completed successfully!"
          else
            echo "⚠️ Some tasks may have failed. Check the logs."
          fi
