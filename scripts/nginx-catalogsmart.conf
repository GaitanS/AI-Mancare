# Nginx configuration for catalogsmart.ro
# Place in: /etc/nginx/sites-available/catalogsmart.ro
# Enable with: sudo ln -s /etc/nginx/sites-available/catalogsmart.ro /etc/nginx/sites-enabled/

# Upstream definition for the Node.js app
upstream catalogsmart_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name catalogsmart.ro www.catalogsmart.ro;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name catalogsmart.ro www.catalogsmart.ro;

    # SSL certificates (will be created by Certbot)
    ssl_certificate /etc/letsencrypt/live/catalogsmart.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalogsmart.ro/privkey.pem;
    
    # SSL configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Root directory
    root /var/www/catalogsmart.ro/public;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static files from Next.js
    location /_next/static {
        alias /var/www/catalogsmart.ro/.next/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public static files
    location /images {
        alias /var/www/catalogsmart.ro/public/images;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Storage files (uploaded content)
    location /storage {
        alias /var/www/catalogsmart.ro/storage;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/catalogsmart.ro/public/favicon.ico;
        expires 1M;
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        alias /var/www/catalogsmart.ro/public/robots.txt;
        access_log off;
    }

    # Proxy to Next.js application
    location / {
        proxy_pass http://catalogsmart_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
